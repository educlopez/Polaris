  "smol-toml@<1.9.0": ">=1.9.0 <2"
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3 <3"
  "@babel/core@<7.29.1": ">=7.29.1 <8"
  "devalue@>=5.0.0 <5.9.3": ">=5.9.3 <6"
  "vite@>=8.0.0 <8.3.3": ">=8.3.3 <9"
